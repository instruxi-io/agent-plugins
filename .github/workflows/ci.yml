name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # A customer only receives a change when the version moves, so a change under
  # enforcer/ needs a bump and a changelog entry; a tag must match the manifests.
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: version identity tests
        run: node --test test/version-identity.test.mjs
      - name: tag equals plugin.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release.mjs check-tag "$GITHUB_REF_NAME"
      - name: enforcer/ changed => version bumped and changelog entry
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- enforcer/; then echo "enforcer/ unchanged"; exit 0; fi
          LAST=$(git describe --tags --abbrev=0 --match 'v*' "origin/${{ github.base_ref }}")
          node scripts/release.mjs check-changed "$LAST" "origin/${{ github.base_ref }}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: install the real Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate enforcer
        run: claude plugin validate enforcer
      - name: manifests agree, hooks.json loads in a real session, login passes stdin
        run: node --test test/validate-plugin.test.mjs
      - name: enforcer plugin tests (package, governor, graph worker)
        working-directory: enforcer
        env:
          GH_TOKEN: ${{ github.token }}   # one graph test resolves a public PR with `gh`
        run: npm test
      # One credential file, four implementations (enforcer, enforcer-files,
      # enforcer-governor (folded in at enforcer/lib/governor), and the graph hooks'
      # Python): each must read what the others write, refreshes included.
      - name: every plugin reads the credential file the others write
        run: |
          GOVERNOR_DIR=enforcer/lib/governor node test/credential-format.test.mjs
      # A renamed MCP tool must fail the build, not silently turn every allow
      # rule into a prompt (and every headless worker into a denied one). The
      # truth is the MCP manifest in the spec lock; it is always checked.
      - name: allow rules and hook matchers name tools in the locked MCP manifest
        run: node test/check-allowlist.mjs && node test/check-allowlist.test.mjs
      # The graph hooks ship inside enforcer (self-gated), so one install brings them.
      - name: enforcer ships the graph hooks
        run: |
          node -e '
            const h = JSON.parse(require("fs").readFileSync("enforcer/hooks/hooks.json", "utf8")).hooks;
            for (const e of ["PreToolUse","PostToolUse","PreCompact","SessionStart","Stop"]) {
              if (!JSON.stringify(h[e] || []).includes("bin/enforcer\\\" event")) { console.error("FAIL no bin/enforcer hook for " + e); process.exit(1); }
            }
            console.log("enforcer hooks.json routes the graph events through bin/enforcer event");'
      - name: manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json kit.json enforcer/.claude-plugin/plugin.json enforcer/.mcp.json enforcer/hooks/hooks.json enforcer/docs/graph/settings.example.json enforcer/lib/api/spec/mcp-manifest.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1]))' "$f" && echo "$f ok"
          done
      # A local source that stops resolving breaks every new install while
      # every existing one keeps working, so check the entries here.
      - name: local marketplace entries resolve to real plugins
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const m = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
            for (const p of m.plugins) {
              if (typeof p.source !== "string" || /^DEPRECATED/.test(p.description)) continue;
              const f = path.join(p.source, ".claude-plugin", "plugin.json");
              if (!fs.existsSync(f)) { console.error(`FAIL ${p.name}: no ${f}`); process.exit(1); }
              const own = JSON.parse(fs.readFileSync(f, "utf8"));
              if (own.name !== p.name) { console.error(`FAIL ${p.name}: plugin.json says ${own.name}`); process.exit(1); }
              console.log(`${p.name} -> ${p.source} ok`);
            }
            const kit = JSON.parse(fs.readFileSync("kit.json", "utf8"));
            const listed = new Set(m.plugins.map(p => p.name + "@" + m.name));
            for (const k of kit.plugins) if (!listed.has(k.id)) { console.error(`FAIL kit.json names ${k.id}, not in the marketplace`); process.exit(1); }
            console.log("kit.json plugins all listed");
          '
      - name: the helper prints JSON and exits 0 when signed out
        run: HOME=$(mktemp -d) node enforcer/bin/enforcer-headers.mjs | node -e 'const h=JSON.parse(require("fs").readFileSync(0,"utf8")); if (Object.keys(h).length) process.exit(1); console.log("{} ok")'

  # The same per-suite runner on every OS. Windows runs hooks and CLIs only (the runner skips
  # dispatcher and governor suites there with a reason); JUnit is uploaded per OS.
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: enforcer suites (per-suite runner, quarantine from test/quarantine.json)
        working-directory: enforcer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm test
      - name: JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ matrix.os }}
          path: enforcer/test-results/junit.xml
